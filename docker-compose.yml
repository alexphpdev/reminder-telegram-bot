x-php-build: &php-build
  context: .
  dockerfile: docker/php/Dockerfile
  args:
    HOST_UID: ${HOST_UID:-1000}
    HOST_GID: ${HOST_GID:-1000}

services:
  reminder-telegram-bot:
    image: caddy:2-alpine
    container_name: reminder-telegram-bot-web
    restart: unless-stopped
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./laravel:/var/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - app-net
      - proxy-net

  app:
    build: *php-build
    container_name: app-php
    restart: unless-stopped
    volumes:
      - ./laravel:/var/www
      - ./database:/var/lib/reminder-bot/sqlite
    networks:
      - app-net

  scheduler:
    build: *php-build
    container_name: app-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./laravel:/var/www
      - ./database:/var/lib/reminder-bot/sqlite
    depends_on:
      - app
    networks:
      - app-net

  poller:
    profiles: ["polling"]
    build: *php-build
    container_name: app-poller
    restart: unless-stopped
    command: ["sh", "-lc", "php artisan telegram:poll-updates --take-over --timeout=${TELEGRAM_POLLING_TIMEOUT:-30}"]
    volumes:
      - ./laravel:/var/www
      - ./database:/var/lib/reminder-bot/sqlite
    depends_on:
      - app
    networks:
      - app-net

networks:
  app-net:
  proxy-net:
    name: shared-reverse-proxy

volumes:
  caddy_data:
  caddy_config:
